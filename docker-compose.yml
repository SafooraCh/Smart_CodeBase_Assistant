services:
  api:
    build: .
    container_name: codebase-assistant-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./data:/code/data
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3:8b
      - DATABASE_URL=sqlite:///./data/db/metadata.db
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codebase-assistant-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
