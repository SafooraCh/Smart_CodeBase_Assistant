services:
  api:
    build: .
    container_name: codebase-assistant-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./data:/code/data
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - DATABASE_URL=sqlite:///./data/db/metadata.db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codebase-assistant-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
